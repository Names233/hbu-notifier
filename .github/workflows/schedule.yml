name: scheduled-scrape

on:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟检查新通知（UTC）
    - cron: "20 0 * * *" # 北京时间每天 08:20 摘要
    - cron: "30 13 * * *" # 北京时间每天 21:30 摘要
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: check
        options:
          - check
          - digest

permissions:
  contents: write

concurrency:
  group: hbu-notifier
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断运行模式
        run: |
          if [ "${{ github.event.inputs.mode }}" = "digest" ] \
             || [ "${{ github.event.schedule }}" = "20 0 * * *" ] \
             || [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "MODE=digest" >> "$GITHUB_ENV"
          else
            echo "MODE=check" >> "$GITHUB_ENV"
          fi

      - name: 运行抓取/推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python main.py --mode "$MODE"

      - name: 提交状态文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "chore: update state [skip ci]" && git push)
